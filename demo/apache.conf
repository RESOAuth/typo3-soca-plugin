<VirtualHost *:80>
ServerName localhost
SSLEngine on
SSLCertificateFile /run/soca/server.crt
SSLCertificateKeyFile /run/soca/server.key
DocumentRoot /var/www/typo3/public
<Directory /var/www/typo3/public>
  Require all granted
  AllowOverride All
</Directory>
# Deliberately omit the query string from access logs to keep codes/state out.
LogFormat "%h %t %m %U %>s" soca_redacted
CustomLog /proc/self/fd/1 soca_redacted
ErrorLog /proc/self/fd/2
</VirtualHost>
